name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12'

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build
        run: npx electron-vite build

      - name: Couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  paquet:
    name: Installeur Windows
    runs-on: windows-latest
    needs: verifier
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installeur
        run: npm run dist-win

      - name: Vérifier que le paquet ne contient que le nécessaire
        shell: bash
        run: |
          contenu=$(npx asar list release/win-unpacked/resources/app.asar)
          echo "$contenu"
          if echo "$contenu" | grep -q 'node_modules'; then
            echo "::error::L'asar embarque node_modules ; resserrer le glob files."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installeur-windows
          path: release/*.exe
          retention-days: 14
